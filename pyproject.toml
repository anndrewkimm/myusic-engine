[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "myusic-engine"
version = "0.1.0"
description = "A private, local-first personal music intelligence pipeline"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Andrew" }]
dependencies = [
  "numpy>=2.0,<3",
  "PyYAML>=6.0,<7",
  "scikit-learn>=1.6,<2",
]

[project.scripts]
myusic-engine = "myusic_engine.cli:main"

[project.optional-dependencies]
phase3 = [
  "librosa>=0.11,<0.12",
  "numpy>=2.0,<3",
  "onnxruntime>=1.22,<2",
  "pyloudnorm>=0.1.1,<0.2",
  "scipy>=1.14,<2",
  "soundfile>=0.13,<0.14",
]
dev = [
  "librosa>=0.11,<0.12",
  "mypy>=1.14,<2",
  "numpy>=2.0,<3",
  "pyloudnorm>=0.1.1,<0.2",
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.9,<1",
  "scipy>=1.14,<2",
  "scikit-learn>=1.6,<2",
  "soundfile>=0.13,<0.14",
  "types-PyYAML>=6.0,<7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
myusic_engine = ["py.typed"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["myusic_engine"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/myusic_engine"]

[[tool.mypy.overrides]]
module = ["onnxruntime", "pyloudnorm", "scipy.*", "sklearn.*", "soundfile"]
ignore_missing_imports = true
